name: Dependabot auto-merge

# Thin caller of the automerge workflow of lukislp/lktec-bot (a GitHub App: routine Dependabot
# updates are approved and armed for auto-merge, every open pull request that falls behind
# main is updated). The triggers stay here because a reusable workflow cannot declare them for
# the caller. Needs the App installed on this repository and the two secrets LKTEC_BOT_APP_ID
# and LKTEC_BOT_PRIVATE_KEY; the policy lives in .github/lktec-bot.yml on main.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, auto_merge_enabled]
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # the reusable workflow reads which commit of itself the run uses

jobs:
  automerge:
    uses: lukislp/lktec-bot/.github/workflows/automerge.yml@ba077f4fb46a8c9dbcd7d0453e5398440c831a80 # v0.7.3
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}
