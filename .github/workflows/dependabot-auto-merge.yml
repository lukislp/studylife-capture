name: Dependabot auto-merge

# Thin caller of the shared implementation in lukislp/ci-workflows (auto-merge of Dependabot
# patch/minor updates, update-stale for every PR that is behind the tip) - the triggers stay
# here because a reusable workflow cannot declare them for the caller. Needs the AUTOMERGE_TOKEN
# repository secret (fine-grained PAT, contents + pull requests write).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, auto_merge_enabled]
  schedule:
    - cron: "23 * * * *"
  push:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  dependabot:
    uses: lukislp/ci-workflows/.github/workflows/dependabot-auto-merge.yml@149565b192eb9b6ebd6aa50eae7368fe7d83b1d9 # v1.6.1
    secrets:
      AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
