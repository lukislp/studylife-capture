name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger for the backfill-release-signatures job at the bottom of this file.
  # Nothing else in this workflow runs on it.
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags to sign, space separated. Empty means the five most recent releases."
        required: false
        default: ""

# One queue entry per ref (or per PR number, so successive pushes to the same PR don't queue
# behind each other) - mirrors the other studylife-* repos' pipelines. Only PR runs get
# cancelled by a newer push to the same PR (fast feedback); a push-to-main run is never
# cancelled mid-flight, so a release can't be interrupted partway through.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

# Least-privilege default for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# jobs that need more declare it themselves.
permissions:
  contents: read
  # The reusable release workflow resolves its own commit through the Actions API.
  actions: read

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache without paying the cost of a
      # clean cache on every normal run - only retries with a forced clean if the first
      # `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm run typecheck
      # Catches NoteDtoPayload (src/api.ts) drifting from the main repo's committed OpenAPI spec -
      # fetches docs/api/openapi.json from studylife@main by default (see
      # scripts/contract-check.mjs), so a server-side field rename fails here instead of silently
      # 401/400-ing once the Web Store review finally lets a drifted build reach users.
      - run: npm run contract-check
      - run: npm audit --audit-level=high

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm test
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studylife-capture-zip
          path: release/*.zip
          retention-days: 7

  # ---------------------------------------------------------------------
  # Version / release - push to main only (mirrors studylife-ai's ci.yml
  # pattern: the lktec-bot release module drives the version and creates the
  # GitHub Release; publish-assets attaches the packaged .zip as a release
  # asset instead of pushing a Docker image - this extension has nothing to
  # containerize).
  # ---------------------------------------------------------------------
  get-version:
    needs: [build]
    if: github.event_name == 'push'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@ba077f4fb46a8c9dbcd7d0453e5398440c831a80 # v0.7.3
    with:
      dry-run: true
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  release:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.released == 'true'
    uses: lukislp/lktec-bot/.github/workflows/release.yml@ba077f4fb46a8c9dbcd7d0453e5398440c831a80 # v0.7.3
    secrets:
      app-id: ${{ secrets.LKTEC_BOT_APP_ID }}
      private-key: ${{ secrets.LKTEC_BOT_PRIVATE_KEY }}

  # Builds the packaged extension at the released version and attaches it, its Sigstore bundle and the
  # build provenance to the GitHub Release the `release` job created. The tag is created by the
  # lktec-bot App through the API (no signature on the tag); these assets are what to verify.
  publish-assets:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # Keyless signing + build provenance for the release assets (see the last steps).
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Write the released version into manifest.json and package.json
        run: |
          node scripts/sync-manifest-version.mjs "$VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm run build
      - run: npm run package
      # `gh release upload` instead of an upload through the release tooling: the Node/undici
      # "invalid content-length header" bug hit octokit's binary upload on v1.0.0 and v1.1.0.
      - name: Upload the packaged .zip to the GitHub Release
        run: gh release upload "$TAG" release/*.zip --clobber
      # Signed release assets (OpenSSF Scorecard "Signed-Releases"): a keyless Sigstore
      # signature bundle per asset plus one GitHub build-provenance attestation, uploaded next
      # to the assets so a download can be verified offline:
      #   cosign verify-blob --bundle <asset>.sigstore.json \
      #     --certificate-identity-regexp '^https://github.com/lukislp/studylife-capture/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <asset>
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the release assets and attach the signature bundles
        run: |
          for f in release/*.zip; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp '^https://github.com/lukislp/studylife-capture/\.github/workflows/ci\.yml@refs/heads/main$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
            gh release upload "$TAG" "$f.sigstore.json" --clobber
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            release/*.zip
      - name: Attach the build provenance to the release
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" provenance.intoto.jsonl
          gh release upload "$TAG" provenance.intoto.jsonl --clobber

  # ---------------------------------------------------------------------
  # Signature backfill for older releases - manual dispatch only
  # ---------------------------------------------------------------------
  # Releases published before the signing step above existed carry no Sigstore bundle next
  # to their assets, and OpenSSF Scorecard's "Signed-Releases" check grades the five most
  # recent releases - so those older ones hold the score down until they age out. This job
  # signs them after the fact: for every asset of the selected releases that has no
  # <asset>.sigstore.json sibling yet, it downloads the asset, signs it keylessly, verifies
  # the bundle and uploads the bundle next to the asset. Re-running it is a no-op for
  # assets that already have a bundle.
  #
  # It deliberately lives in THIS workflow file instead of a file of its own. The keyless
  # certificate's identity is "<repo>/<workflow path>@<ref>", so a dispatch of
  # .github/workflows/ci.yml on refs/heads/main mints exactly the identity the
  # release path mints, and the bundles satisfy the very same
  # --certificate-identity-regexp the release job pins. That is asserted per asset below -
  # a mismatch fails the step before anything is uploaded.
  #
  # No build provenance is attached here on purpose: attest-build-provenance would assert
  # that this run built the artifact, which is false for an artifact downloaded from an
  # older release.
  backfill-release-signatures:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.githubapp.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            fulcio.sigstore.dev:443
            github.com:22
            github.com:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            run-actions-*.actions.githubusercontent.com:443
            timestamp.sigstore.dev:443
            token.actions.githubusercontent.com:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the assets of releases that have no signature bundle yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          if [ -n "${TAGS// /}" ]; then
            read -r -a TAG_LIST <<< "$TAGS"
          else
            mapfile -t TAG_LIST < <(gh release list --repo "$REPO" --limit 5 --json tagName --jq '.[].tagName')
          fi
          if [ "${#TAG_LIST[@]}" -eq 0 ]; then
            echo "No releases to process."
            exit 0
          fi
          echo "Releases to process: ${TAG_LIST[*]}"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          SIGNED=0
          for TAG in "${TAG_LIST[@]}"; do
            [ -n "$TAG" ] || continue
            ASSETS="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
            while IFS= read -r NAME; do
              [ -n "$NAME" ] || continue
              # Signature bundles and provenance files are not themselves signed.
              case "$NAME" in
                *.sigstore.json | *.intoto.jsonl) continue ;;
              esac
              if printf '%s\n' "$ASSETS" | grep -Fxq "$NAME.sigstore.json"; then
                echo "$TAG/$NAME: bundle already present, skipping"
                continue
              fi
              echo "$TAG/$NAME: signing"
              gh release download "$TAG" --repo "$REPO" --pattern "$NAME" --dir "$WORK" --clobber
              cosign sign-blob --yes --bundle "$WORK/$NAME.sigstore.json" "$WORK/$NAME"
              cosign verify-blob --bundle "$WORK/$NAME.sigstore.json" \
                --certificate-identity-regexp '^https://github.com/lukislp/studylife-capture/\.github/workflows/ci\.yml@refs/heads/main$' \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com "$WORK/$NAME"
              gh release upload "$TAG" "$WORK/$NAME.sigstore.json" --repo "$REPO" --clobber
              # Release assets can be hundreds of megabytes, so don't keep them on disk.
              rm -f "$WORK/$NAME" "$WORK/$NAME.sigstore.json"
              SIGNED=$((SIGNED + 1))
            done <<< "$ASSETS"
          done
          echo "Signature bundles uploaded: $SIGNED"
