name: CI

on:
  push:
    branches: [main]
  pull_request:

# One queue entry per ref (or per PR number, so successive pushes to the same PR don't queue
# behind each other) - mirrors the other studylife-* repos' pipelines. Only PR runs get
# cancelled by a newer push to the same PR (fast feedback); a push-to-main run is never
# cancelled mid-flight, so a release can't be interrupted partway through.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

# Least-privilege default for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Self-heal a stale/corrupted actions/setup-node npm cache without paying the cost of a
      # clean cache on every normal run - only retries with a forced clean if the first
      # `npm ci` actually fails.
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm run typecheck
      # Catches NoteDtoPayload (src/api.ts) drifting from the main repo's committed OpenAPI spec -
      # fetches docs/api/openapi.json from studylife@main by default (see
      # scripts/contract-check.mjs), so a server-side field rename fails here instead of silently
      # 401/400-ing once the Web Store review finally lets a drifted build reach users.
      - run: npm run contract-check
      - run: npm audit --audit-level=high

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci || (npm cache clean --force && npm ci)
      - run: npm test
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: studylife-capture-zip
          path: release/*.zip
          retention-days: 7

  # ---------------------------------------------------------------------
  # Version / release - push to main only (mirrors studylife-ai's ci.yml
  # pattern: semantic-release drives the version, @semantic-release/github
  # attaches the packaged .zip as a GitHub Release asset instead of pushing
  # a Docker image - this extension has nothing to containerize).
  # ---------------------------------------------------------------------
  get-version:
    needs: [build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # @semantic-release/github's verifyConditions step checks the token has repo push access
    # (contents: write) even during a dry run - a read-only token fails that check outright.
    # issues:write/pull-requests:write are NOT needed here: those only get exercised by the
    # publish/success/fail lifecycle steps, which dry_run: true skips entirely.
    permissions:
      contents: write
    outputs:
      next_version: ${{ steps.semrel.outputs.new_release_version }}
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      # ref: main (branch tip), not the default github.sha (the push event's SHA) - a "[skip ci]"
      # commit (e.g. a version-bump commit from a previous release, or another push) can land on
      # main between this workflow's trigger and this job actually starting. If this checked out
      # github.sha instead, semantic-release's "local branch is behind the remote" guard would
      # then analyze that now-stale SHA and silently skip the release entirely - no error, just
      # nothing published (seen live in sibling studylife-* repos). ref: main always resolves to
      # whatever main points to right now, so this also covers the older "Re-run jobs" staleness
      # gap (two PRs merged minutes apart left get-version stuck on the first push's SHA on
      # re-run) that used to need a manual `git fetch && git checkout -B main origin/main` step
      # after checkout - no longer needed once checkout itself targets the branch tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      # Ruleset bypass for the release commit (2026-09-11 main-protection rollout): main is
      # protected by a ruleset (pull request + green test stage) that the GitHub Actions app
      # cannot be a bypass actor for on a personal repository, so semantic-release pushes over
      # SSH as a write-enabled DEPLOY KEY instead, which can. No-op while the secret is unset -
      # the push then goes through the GITHUB_TOKEN https remote exactly as before. Needed in
      # get-version too: @semantic-release/git's verifyConditions runs `git push --dry-run`
      # even in dry-run mode. Same mechanism as lukislp/studylife's ci-cd.yml.
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@f3d5b5b26069f5678e813b2bc7440cb441aa28d0 # v1.1.0
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci || (npm cache clean --force && npm ci)
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@c6305937598d262117eca032e1365d4880a3fe53 # v1.4.1
        with:
          dry-run: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci/chore-only) - this is the expected, common case with Conventional Commits, not a failure. semantic-release below skips itself via needs.get-version.outputs.published." | tee -a "$GITHUB_STEP_SUMMARY"

  semantic-release:
    needs: [get-version]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Keyless signing + build provenance for the release assets (see the last steps).
      id-token: write
      attestations: write
    steps:
      # ref: main for the same [skip ci]-race reason as get-version above - branch tip may have
      # moved past the triggering push by the time this job starts (get-version's dry run already
      # analyzed the current tip and found something to publish, so this job must analyze that
      # same tip, not a stale github.sha, or semantic-release's "local branch is behind the
      # remote" guard silently releases nothing here too). This job also builds the version-
      # stamped release zip below (after semantic-release's own version-bump commit), so the same
      # checkout needs to already be sitting on main's tip for that commit to land correctly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      # Ruleset bypass for the release commit (2026-09-11 main-protection rollout): main is
      # protected by a ruleset (pull request + green test stage) that the GitHub Actions app
      # cannot be a bypass actor for on a personal repository, so semantic-release pushes over
      # SSH as a write-enabled DEPLOY KEY instead, which can. No-op while the secret is unset -
      # the push then goes through the GITHUB_TOKEN https remote exactly as before. Needed in
      # get-version too: @semantic-release/git's verifyConditions runs `git push --dry-run`
      # even in dry-run mode. Same mechanism as lukislp/studylife's ci-cd.yml.
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@f3d5b5b26069f5678e813b2bc7440cb441aa28d0 # v1.1.0
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci || (npm cache clean --force && npm ci)
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@c6305937598d262117eca032e1365d4880a3fe53 # v1.4.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # Retry once for the narrow window where an out-of-band push to main landed between this
      # job's checkout and its own push (same pattern as studylife/studylife-ai's ci workflows).
      - if: steps.semrel.outcome == 'failure'
        name: "Diagnose before retrying (expected: an out-of-band push landed since checkout)"
        run: |
          git fetch origin main
          BEFORE_SHA="$(git rev-parse HEAD)"
          AFTER_SHA="$(git rev-parse origin/main)"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "origin/main moved since checkout ($BEFORE_SHA -> $AFTER_SHA) - this matches the out-of-band-push race this retry is designed for."
          else
            echo "::warning::origin/main did NOT move since checkout - this failure is likely NOT the expected out-of-band-push race. Retrying anyway, but check the semantic-release log above for the real cause before assuming this is just a race."
          fi
          git checkout -B main origin/main
      - if: steps.semrel.outcome == 'failure'
        id: semrel_retry
        uses: lukislp/ci-workflows/.github/actions/semantic-release@c6305937598d262117eca032e1365d4880a3fe53 # v1.4.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # @semantic-release/github no longer uploads the packaged .zip itself (removed from its
      # `assets` config in .releaserc.json). Its asset-upload call hit a reproducible Node/undici
      # bug - "invalid content-length header", thrown while octokit builds the OUTGOING request
      # for a binary body with an explicit numeric Content-Length header - on both v1.0.0 and
      # v1.1.0's release, not a one-off race (octokit's own internal retry already tried 3 times
      # first). It also left the GitHub Release stuck in draft both times: @semantic-release/github
      # creates the release as a draft, uploads assets, then publishes it - an asset-upload
      # exception skips that last step. `gh release upload` does the same job over a completely
      # different HTTP stack (Go, not Node's built-in fetch/undici) and worked first-try both times
      # this was fixed manually. Runs after EITHER semrel attempt succeeded - the working tree
      # already has the version-bumped manifest.json/package.json from whichever one committed it,
      # so a fresh build+package here always matches the tag being uploaded to.
      - name: Upload the packaged .zip to the GitHub Release
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
        run: |
          TAG="${{ steps.semrel.outputs.new_release_git_tag || steps.semrel_retry.outputs.new_release_git_tag }}"
          npm run build
          npm run package
          gh release upload "$TAG" release/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signed release assets (OpenSSF Scorecard "Signed-Releases"): a keyless Sigstore
      # signature bundle per asset plus one GitHub build-provenance attestation, uploaded next
      # to the assets so a download can be verified offline:
      #   cosign verify-blob --bundle <asset>.sigstore.json \
      #     --certificate-identity-regexp '^https://github.com/lukislp/studylife-capture/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com <asset>
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
      - name: Sign the release assets and attach the signature bundles
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semrel.outputs.new_release_git_tag || steps.semrel_retry.outputs.new_release_git_tag }}
        run: |
          for f in release/*.zip; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp '^https://github.com/lukislp/studylife-capture/\.github/workflows/ci\.yml@refs/heads/main$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
            gh release upload "$TAG" "$f.sigstore.json" --clobber
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
        id: provenance
        with:
          subject-path: |
            release/*.zip
      - name: Attach the build provenance to the release
        if: steps.semrel.outcome == 'success' || steps.semrel_retry.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.semrel.outputs.new_release_git_tag || steps.semrel_retry.outputs.new_release_git_tag }}
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" provenance.intoto.jsonl
          gh release upload "$TAG" provenance.intoto.jsonl --clobber
