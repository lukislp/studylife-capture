# Weekly Dependabot updates: GitHub Actions and npm (dev deps grouped).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
    # A new release waits three days before Dependabot proposes it, except the lktec-bot
    # workflows: those are our own and a fix there should reach every caller right away.
    cooldown:
      default-days: 3
      exclude:
        - "lukislp/lktec-bot*"
    # All lukislp/ci-workflows bumps share one PR, so they take one slot of the
    # limit and other actions (e.g. harden-runner) are not starved by them.
    groups:
      ci-workflows:
        patterns:
          - "lukislp/ci-workflows*"
      # Same for the lktec-bot workflows (automerge, lockfiles, release): one PR per release.
      lktec-bot:
        patterns:
          - "lukislp/lktec-bot*"
      # init, analyze and upload-sarif must run the same version - one PR for all.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      dev:
        dependency-type: development
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 5
