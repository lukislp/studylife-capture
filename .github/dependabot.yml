# Weekly Dependabot updates: GitHub Actions and npm (dev deps grouped).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      dev:
        dependency-type: development
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
