<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>StudyLife Capture</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="brand-icon">&#10022;</span>
      <span class="brand-name">StudyLife Capture</span>
    </div>
    <p>Select text or right-click anywhere on a page &rarr; <strong>Save to StudyLife</strong>.</p>
    <p class="hint" id="connection-hint">Connect your self-hosted instance below first.</p>

    <label for="server-url">Server URL</label>
    <input class="input" id="server-url" type="url" placeholder="https://studylife.example.com" required />

    <button class="btn-primary" id="connect-button" type="button">Connect with StudyLife</button>
    <p id="connect-status" class="status" role="status"></p>

    <button class="btn-link" id="toggle-manual" type="button" aria-expanded="false">
      Enter API key manually instead
    </button>

    <form id="settings-form" class="manual-form" hidden>
      <p class="hint">For servers the browser can't reach directly, e.g. a self-signed
        certificate on your local network.</p>
      <label for="api-key">Capture API key</label>
      <input class="input" id="api-key" type="password" placeholder="Generated in StudyLife → Setup" required />

      <button class="btn-secondary" type="submit">Save manually</button>
      <p id="status" class="status" role="status"></p>
    </form>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
